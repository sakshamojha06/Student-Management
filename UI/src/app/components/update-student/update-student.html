<div class="container mt-5">
  <div class="card shadow-sm update-card">
    <div class="card-header bg-primary text-white">
      <h4 class="mb-0">
        <i class="bi bi-pencil-square"></i>
        Update Student
      </h4>
    </div>

    <div class="card-body">
      <form #studentForm="ngForm" (ngSubmit)="updateStudent()">

        <div class="mb-3">
          <label class="form-label fw-semibold">Student Name</label>

          <input
            type="text"
            class="form-control"
            name="name"
            [(ngModel)]="student.name"
            required
            placeholder="Enter student name">
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Course</label>

          <select
            class="form-select"
            name="courseId"
            [(ngModel)]="student.courseId"
            required>

            <option [ngValue]="0" disabled>Select Course</option>

            @for (course of courses; track course.id) {
              <option [ngValue]="course.id">
                {{ course.courseName }}
              </option>
            }
          </select>
        </div>

        <div class="d-flex gap-2">
          <button
            type="submit"
            class="btn btn-primary"
            [disabled]="studentForm.invalid || student.courseId === 0">
            <i class="bi bi-check-circle"></i>
            Update Student
          </button>

          <a routerLink="/students" class="btn btn-secondary">
            <i class="bi bi-x-circle"></i>
            Cancel
          </a>
        </div>

      </form>
    </div>
  </div>
</div>
